<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OC NoteTaker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="Index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kavivanar&display=swap" rel="stylesheet">
</head>

<body>
  <div id="header">
    <h1>OC NoteTaker</h1>
  </div>
  <div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 400px; background-color: #B8DEC7;">
      <h2 class="kaushan-script-regular">Gatekeeper</h2>
      <input type="email" id="email" class="form-control mb-2" placeholder="Email">
      <input type="password" id="password" class="form-control mb-2" placeholder="Password">
      <button onclick="signUp()" class="btn btn-primary w-100 mb-2">Sign Up</button>
      <button onclick="login()" class="btn btn-outline-dark w-100">Login</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  
  <script>
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await _supabase.auth.signUp({ email, password });
      if (error) alert(error.message); else alert("Check your email for a confirmation link!");
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message); else window.location.href = "Main.html";
    }
  </script>
</body>

</html>
